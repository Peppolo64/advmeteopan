// Firma fissa dell'APK, per installare ogni nuova versione sopra la precedente senza disinstallare.
// La chiave NON è nel repository: il workflow la ricostruisce dai segreti GitHub
// SKYGUARDIAN_KEYSTORE_BASE64 e SKYGUARDIAN_KEYSTORE_PASSWORD. Senza segreti si usa la chiave di debug.
def ksFile = System.getenv('SKYGUARDIAN_KEYSTORE_FILE')
def ksPass = System.getenv('SKYGUARDIAN_KEYSTORE_PASSWORD')
def runNumber = System.getenv('GITHUB_RUN_NUMBER')

// Versione: unica fonte version.js nella radice del repository (window.SKY_VERSION = 'x.y.z')
def appVersion = '0.0.0'
def versionFile = new File(rootProject.projectDir, '../../version.js')
if (versionFile.exists()) {
    def m = (versionFile.text =~ /SKY_VERSION\s*=\s*'([0-9]+\.[0-9]+\.[0-9]+)'/)
    if (m.find()) appVersion = m.group(1)
}
def apkPrefix = project.name == 'wear' ? 'SkyGuardian-Wear' : 'SkyGuardian'

android {
    // versionCode sempre crescente (numero della build): Android accetta l'aggiornamento
    defaultConfig.versionCode = runNumber ? 100 + runNumber.toInteger() : 1
    defaultConfig.versionName = runNumber ? "${appVersion} (build ${runNumber})" : appVersion
    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "${apkPrefix}-v${appVersion}${runNumber ? '-build' + runNumber : ''}.apk"
        }
    }
    if (ksFile && ksPass && file(ksFile).exists()) {
        signingConfigs {
            skyguardian {
                storeFile file(ksFile)
                storePassword ksPass
                keyAlias 'skyguardian'
                keyPassword ksPass
            }
        }
        buildTypes {
            debug { signingConfig signingConfigs.skyguardian }
            release { signingConfig signingConfigs.skyguardian }
        }
        println "SkyGuardian: APK firmato con la chiave fissa"
    } else {
        println "SkyGuardian: chiave fissa assente, uso la chiave di debug (l'aggiornamento richiederà di disinstallare)"
    }
}
